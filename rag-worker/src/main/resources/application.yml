spring:
  application:
    name: rag-worker
  main:
    web-application-type: none
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:rag}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:rag123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
  data:
    redis:
      host: ${MIDDLEWARE_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${MIDDLEWARE_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  elasticsearch:
    uris: http://${MIDDLEWARE_HOST:127.0.0.1}:${ES_PORT:9200}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  # Mapper XML 统一放在 rag-common 模块的 resources/mapper 下（classpath*: 以覆盖依赖 jar）
  mapper-locations: classpath*:mapper/*.xml
  global-config:
    banner: false
    db-config:
      id-type: auto
      # 逻辑删除字段名（XML 中显式手写 deleted=0 / UPDATE deleted=1，此配置仅作约定声明）
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

rag:
  mq:
    exchange: rag.ingest
    queue: rag.ingest.parse
    retry-queue: rag.ingest.retry
    dlq-queue: rag.ingest.dlq
    media-queue: rag.media.transcode
    sha256-queue: rag.sha256
  media:
    # ffmpeg 可执行文件路径（文件库视频转 HLS；ffprobe 取同目录）。
    # 固定用 7.1 构建：9.x 要求 NVENC API 13.1（驱动 610+），M4000 驱动最高 582 只提供 13.0，会报 "Function not implemented"
    ffmpeg-path: ${FFMPEG_PATH:D:\develop\ffmpeg\ffmpeg-7.1\bin\ffmpeg.exe}
    # 长视频（≥60s）按时间轴切段并行转码的段数：单路 ffmpeg 无法跑满 NVENC，3 路并发聚合速度约 4x；
    # 显卡较弱/多任务并存可调小为 1（关闭并行）或 2
    transcode-parallel: ${TRANSCODE_PARALLEL:3}
  storage:
    endpoint: http://${MIDDLEWARE_HOST:127.0.0.1}:${RUSTFS_PORT:9000}
    access-key: ${RUSTFS_USER:rustfsadmin}
    secret-key: ${RUSTFS_PASSWORD:rustfsadmin123}
    bucket: ${RUSTFS_BUCKET:rag-files}
    region: ${RUSTFS_REGION:us-east-1}
  milvus:
    host: ${MIDDLEWARE_HOST:127.0.0.1}
    port: ${MILVUS_PORT:19530}
  etcd:
    endpoints: http://${MIDDLEWARE_HOST:127.0.0.1}:${ETCD_PORT:2379}
    enabled: true
  ocr:
    # Tesseract 训练数据目录（需包含 chi_sim.traineddata 等），留空则 OCR 降级跳过
    tessdata: ${RAG_OCR_TESSDATA:}
    langs: ${RAG_OCR_LANGS:chi_sim+eng}
  es:
    analyzer: ${RAG_ES_ANALYZER:standard}
  reconcile:
    # 索引一致性巡检（MySQL CHILD 切片 vs ES/Milvus chunkId）：默认关闭，首轮建议 dry-run 观察报告后再开启删除
    enabled: ${RAG_RECONCILE_ENABLED:false}
    dry-run: ${RAG_RECONCILE_DRY_RUN:true}
    # 删除白名单（逗号分隔 kbId）：dry-run=false 时仅白名单内 KB 执行删除；留空表示不限制
    delete-kb-ids: ${RAG_RECONCILE_DELETE_KB_IDS:}
    interval-ms: ${RAG_RECONCILE_INTERVAL_MS:3600000}
    initial-delay-ms: ${RAG_RECONCILE_INITIAL_DELAY_MS:300000}
    max-kbs-per-run: ${RAG_RECONCILE_MAX_KBS:1}
    max-docs-per-kb: ${RAG_RECONCILE_MAX_DOCS:200}
    max-ids-per-doc: ${RAG_RECONCILE_MAX_IDS:10000}
    max-external-calls: ${RAG_RECONCILE_MAX_CALLS:2000}
    max-duration-ms: ${RAG_RECONCILE_MAX_DURATION_MS:300000}
    cleanup-task-limit: ${RAG_RECONCILE_CLEANUP_LIMIT:100}
    retention-days: ${RAG_RECONCILE_RETENTION_DAYS:30}
    report-ttl-hours: ${RAG_RECONCILE_REPORT_TTL_HOURS:168}
  llm:
    timeout-seconds: 60
  worker:
    max-retry: 3
    retry-base-delay-ms: 10000
    # Embedding 批次并发度（每批 ≤10 条）：大文档向量化耗时近似线性下降；上游限流会自动退避重试
    embedding-concurrency: ${RAG_EMBEDDING_CONCURRENCY:8}
    # 同时处理的文档数（每个文档占 1 个线程；需 ≤ 租户 max_mq_concurrency，否则多余任务会排队重试）
    ingest-concurrency: ${RAG_INGEST_CONCURRENCY:2}

logging:
  level:
    com.rag: info
