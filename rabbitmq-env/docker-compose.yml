services:
  rabbitmq:
    container_name: rabbitmq
    build:
      context: .
    image: g2plus/rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "15672:15672"
      - "5672:5672"
      - "16163:61613"
    restart: unless-stopped
    volumes:
      - ./rabbitmq/log:/var/log/rabbitmq
      - ./rabbitmq/data:/var/lib/rabbitmq
    networks:
      - rabbitmq

networks:
  rabbitmq:
    driver: bridge
