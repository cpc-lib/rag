services:
  mysql:
    image: registry.cn-hangzhou.aliyuncs.com/snow-io/mysql:8.4
    container_name: rag-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rag123456
      MYSQL_DATABASE: rag
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+08:00
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prag123456"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: registry.cn-hangzhou.aliyuncs.com/snow-io/redis:7.4-alpine
    container_name: rag-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # RustFS：S3 兼容对象存储（替代 MinIO），9000 为 S3 API、9001 为 Web 控制台
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rag-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_USER:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_PASSWORD:-rustfsadmin123}
      RUSTFS_REGION: us-east-1
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # 初始化桶：rag-files 存业务文件，a-bucket 为 Milvus 默认桶（已存在时幂等忽略）
  rustfs-init:
    image: amazon/aws-cli:latest
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_USER:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_PASSWORD:-rustfsadmin123}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        aws --endpoint-url http://rustfs:9000 s3 mb s3://rag-files || true
        aws --endpoint-url http://rustfs:9000 s3 mb s3://a-bucket || true

  # etcd：同时作为 Milvus 元数据后端与业务服务注册/动态配置中心（业务前缀 /rag/）
  etcd:
    image: registry.cn-hangzhou.aliyuncs.com/snow-io/etcd:v3.5.18
    container_name: rag-etcd
    restart: unless-stopped
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
    command: etcd --data-dir=/etcd-data
    ports:
      - "2379:2379"
    volumes:
      - etcd-data:/etcd-data

  elasticsearch:
    image: registry.cn-hangzhou.aliyuncs.com/snow-io/elasticsearch:8.14.3
    container_name: rag-es
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      TZ: Asia/Shanghai
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  milvus:
    image: registry.cn-hangzhou.aliyuncs.com/snow-io/milvus:v2.5.4
    container_name: rag-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      # Milvus 的对象存储配置变量名固定为 MINIO_*，此处指向 RustFS
      MINIO_ADDRESS: rustfs:9000
      MINIO_ACCESS_KEY_ID: ${RUSTFS_USER:-rustfsadmin}
      MINIO_SECRET_ACCESS_KEY: ${RUSTFS_PASSWORD:-rustfsadmin123}
      MINIO_BUCKET: a-bucket
      COMMON_STORAGETYPE: remote
      TZ: Asia/Shanghai
    depends_on:
      etcd:
        condition: service_started
      rustfs-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 20

volumes:
  mysql-data: {}
  redis-data: {}
  rustfs-data: {}
  etcd-data: {}
  es-data: {}
  milvus-data: {}
